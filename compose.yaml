services:
  api:
    build: ./
    image: restapi
    container_name: restapi
    env_file:
      - .env.api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: always
    container_name: pgdb
    env_file:
      - .env.db
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - PGDATA:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tasksdb"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  
volumes:
  PGDATA: